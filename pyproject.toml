[project]
name = "quote-extract"
version = "0.1.0"
description = "N.E.K.O 插件：导入你自己的语录库（R2/D1/WebDAV/直链/本地文件）并随机抽取"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "baixiangyuan" }]
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# 插件根目录的 __init__.py 依赖 N.E.K.O SDK，禁止 pytest 把它当作测试模块导入
addopts = "--import-mode=importlib"
